<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdCreative — чат</title>
</head>
<body>
<h1>AdCreative</h1>
<p><a href="/">Новий проєкт</a> · <a href="/stats">Статистика</a></p>

<section id="start">
  <h2>Новий ролик</h2>
  <form id="startForm">
    <p><label>Адреса сайту бізнесу<br><input name="url" type="text" size="60" placeholder="https://example.com"></label></p>
    <p><label>Або кілька речень про бізнес (якщо сайту немає)<br><textarea name="manualText" rows="4" cols="60"></textarea></label></p>
    <p><label>Фото (до 10 файлів, JPEG/PNG/HEIC до 25 МБ)<br><input name="photos" type="file" multiple accept="image/*,.heic,.heif"></label></p>
    <p><button type="submit" id="startBtn">Почати</button></p>
  </form>
  <p id="startError" role="alert"></p>
</section>

<section id="chat" hidden>
  <p>
    Проєкт: <code id="projectId"></code> ·
    Стан: <span id="status">—</span> ·
    <strong id="cost">Витрачено: $0.00</strong> ·
    <span id="conn"></span>
  </p>
  <p id="progress"></p>
  <div id="feed" aria-live="polite"></div>

  <div id="musicBlock" hidden>
    <h3>Музика</h3>
    <!-- biome-ignore lint/a11y/useMediaCaption: інструментальна музика без слів -->
    <audio id="audio" controls preload="none"></audio>
  </div>
  <div id="videoBlock" hidden>
    <h3>Відео</h3>
    <div id="videos"></div>
  </div>

  <hr>
  <form id="msgForm">
    <p><textarea id="msgText" rows="3" cols="60" placeholder="Напишіть відповідь, питання або правки"></textarea></p>
    <p>
      <button type="submit">Надіслати</button>
      <button type="button" id="btnApprove">Затвердити</button>
      <button type="button" id="btnEdit">Правки</button>
      <button type="button" id="btnRetry">Спробувати ще раз</button>
    </p>
  </form>
  <form id="uploadForm">
    <p>
      <label>Додати фото: <input id="uploadFiles" type="file" multiple accept="image/*,.heic,.heif"></label>
      <button type="submit">Завантажити</button>
    </p>
  </form>
  <p id="chatError" role="alert"></p>
</section>

<script>
"use strict";

const EVENT_TYPES = ["message", "progress", "checkpoint", "artifact", "cost", "state", "error"];
const FORMAT_LABELS = { vertical: "9:16", square: "1:1", landscape: "16:9" };
const ROLE_LABELS = { user: "Ви", assistant: "AdCreative", system: "Система" };
const STATUS_LABELS = {
  intake: "прийнято",
  crawling: "сканую сайт",
  brandkit: "збираю бренд-кіт",
  awaiting_brand: "чекаю на погодження бренду",
  scripting: "пишу сценарій",
  awaiting_script: "чекаю на погодження текстів",
  directing: "генерую сцени і музику",
  awaiting_storyboard: "чекаю на погодження розкадровки",
  rendering: "рендерю",
  delivered: "готово",
  revising: "вношу правки",
  failed: "помилка",
};
const AWAITING = ["awaiting_brand", "awaiting_script", "awaiting_storyboard"];

const $ = (id) => document.getElementById(id);
let projectId = new URLSearchParams(location.search).get("project");
let lastEventId = null;
let currentRev = null;
let source = null;
let reconnectTimer = null;
const seen = new Set();

/* ---------- DOM helpers (лише textContent, без innerHTML) ---------- */

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "onclick") node.addEventListener("click", v);
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of children.flat(Number.POSITIVE_INFINITY)) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

/** Текст із переносами рядків. */
function multiline(text) {
  const out = [];
  String(text).split("\n").forEach((line, i) => {
    if (i > 0) out.push(el("br"));
    out.push(line);
  });
  return out;
}

function feed(node) {
  const f = $("feed");
  f.append(node);
  node.scrollIntoView({ block: "end" });
}

function money(n) {
  return `$${(Number(n) || 0).toFixed(2)}`;
}

function showError(where, message) {
  $(where).textContent = message || "";
}

/* ---------- API ---------- */

async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = null;
  try {
    data = await res.json();
  } catch (e) {
    data = null;
  }
  if (!res.ok) throw new Error((data?.message) || `Помилка ${res.status}`);
  return data;
}

function projectPath(suffix) {
  return `/api/projects/${encodeURIComponent(projectId)}${suffix}`;
}

async function sendCommand(body) {
  showError("chatError", "");
  try {
    await api(projectPath("/commands"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (e) {
    showError("chatError", e.message);
  }
}

async function sendMessage(text) {
  text = String(text || "").trim();
  if (!text) return;
  showError("chatError", "");
  try {
    await api(projectPath("/messages"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    return true;
  } catch (e) {
    showError("chatError", e.message);
    return false;
  }
}

const approve = () => sendCommand({ type: "approve", rev: currentRev });
const retry = () => sendCommand({ type: "retry" });
const setLogo = (assetId) => sendCommand({ type: "set_logo", assetId });
function confirmRestart() {
  if (confirm("Почати все спочатку? Поточний прогрес лишиться в історії.")) {
    sendCommand({ type: "restart_confirmed" });
  }
}
function startEdit() {
  const input = $("msgText");
  input.placeholder = "Опишіть, що змінити";
  input.focus();
}

const BUTTONS = {
  approve: ["Затвердити", approve],
  edit: ["Правки", startEdit],
  retry: ["Спробувати ще раз", retry],
  restart_confirm: ["Так, почати заново", confirmRestart],
};

function buttonsFor(list) {
  if (!list || list.length === 0) return null;
  return el("p", {}, list.filter((b) => BUTTONS[b]).map((b) => el("button", { type: "button", onclick: BUTTONS[b][1] }, BUTTONS[b][0]), " "));
}

/* ---------- Рендер подій ---------- */

function renderMessage(ev) {
  feed(el("div", { "data-role": ev.role },
    el("p", {}, el("b", {}, `${ROLE_LABELS[ev.role] || ev.role}: `), multiline(ev.text)),
    buttonsFor(ev.buttons)));
}

function renderProgress(ev) {
  const counter = ev.total ? ` (${ev.done || 0}/${ev.total})` : "";
  $("progress").textContent = ev.label + (ev.label.includes("/") ? "" : counter);
}

function renderState(ev) {
  currentRev = ev.rev;
  applyStatus(ev.status);
  if (!AWAITING.includes(ev.status)) $("progress").textContent = "";
}

function applyStatus(status) {
  $("status").textContent = STATUS_LABELS[status] || status;
  $("btnApprove").disabled = !AWAITING.includes(status);
  $("btnRetry").disabled = status !== "failed";
}

function renderCost(ev) {
  $("cost").textContent = `Витрачено: ${money(ev.totalUsd)}`;
  if (ev.breakdown && ev.breakdown.length > 0) {
    feed(el("div", {},
      el("p", {}, el("b", {}, "Витрати за етапами:")),
      el("ul", {}, ev.breakdown.map((b) => el("li", {}, `${b.stage}: ${money(b.usd)}`))),
      el("p", {}, `Разом: ${money(ev.totalUsd)}`)));
  }
}

function renderError(ev) {
  feed(el("div", { "data-kind": "error" },
    el("p", {}, el("b", {}, `Помилка${ev.stage ? ` (${ev.stage})` : ""}: `), ev.message),
    ev.retryable ? buttonsFor(["retry"]) : null));
}

function setMusic(url) {
  if (!url) return;
  $("audio").src = url;
  $("musicBlock").hidden = false;
}

function renderArtifact(ev) {
  const label = ev.format ? FORMAT_LABELS[ev.format] || ev.format : "";
  switch (ev.kind) {
    case "video": {
      $("videoBlock").hidden = false;
      $("videos").append(el("figure", {},
        el("video", { controls: true, preload: "metadata", width: 360, src: ev.url }),
        el("figcaption", {}, `Формат ${label} · `, el("a", { href: ev.url, download: "" }, "завантажити MP4"))));
      break;
    }
    case "music":
      setMusic(ev.url);
      break;
    case "poster":
      feed(el("p", {}, "Постер: ", el("a", { href: ev.url, target: "_blank" }, el("img", { src: ev.url, width: 160, alt: "Постер" }))));
      break;
    case "still":
    case "sheet":
      feed(el("p", {}, `${(ev.kind === "sheet" ? "Аркуш " : "Кадр ") + (ev.sceneId || "")} ${label} `,
        el("a", { href: ev.url, target: "_blank" }, el("img", { src: ev.url, width: 200, alt: ev.kind }))));
      break;
    default:
      feed(el("p", {}, el("a", { href: ev.url, target: "_blank" }, ev.kind + (label ? ` ${label}` : ""))));
  }
}

function list(items, render) {
  if (!items || items.length === 0) return el("p", {}, "—");
  return el("ul", {}, items.map((x) => el("li", {}, render(x))));
}

function renderBrandCheckpoint(p, box) {
  const bk = p.brandkit;
  box.append(el("p", {}, el("b", {}, bk.identity.name), bk.identity.tagline ? ` — ${bk.identity.tagline}` : "",
    ` (${bk.identity.category}${bk.identity.city ? `, ${bk.identity.city}` : ""})`));

  box.append(el("h4", {}, "Палітра"));
  box.append(el("p", {}, Object.entries(bk.palette).map(([name, hex]) => {
    const swatch = el("span", { title: name }, "    ");
    swatch.style.background = hex;
    return el("span", {}, swatch, ` ${name} ${hex}  `);
  })));

  box.append(el("h4", {}, "Шрифти"));
  box.append(el("p", {}, `Заголовки: ${bk.typography.heading.family} · Текст: ${bk.typography.body.family}`));

  box.append(el("h4", {}, "Лого"));
  const current = bk.logo.assetId;
  box.append(el("p", {}, current ? `Поточне: ${current}` : `Лого текстом: ${bk.logo.textFallback}`));
  if (p.logoCandidates && p.logoCandidates.length > 0) {
    box.append(el("p", {}, "Кандидати (клікніть, щоб обрати):"));
    box.append(el("p", {}, p.logoCandidates.map((c) =>
      el("button", { type: "button", title: "Обрати це лого", onclick: () => setLogo(c.assetId) },
        el("img", { src: c.url, width: 120, alt: c.assetId }),
        el("br"), c.assetId === current ? `✓ ${c.assetId}` : c.assetId))));
  }

  box.append(el("h4", {}, "Тон і аудиторія"));
  box.append(el("p", {}, `${bk.voice.tone.join(", ")}. ${bk.voice.description}`));
  box.append(el("p", {}, `Аудиторія: ${bk.audience}`));

  box.append(el("h4", {}, "Послуги"));
  box.append(list(bk.offerings, (o) => o.name + (o.price ? ` — ${o.price}` : "") + (o.description ? `: ${o.description}` : "")));

  box.append(el("h4", {}, "Гео"));
  box.append(el("p", {}, [bk.location.address, bk.location.city, bk.location.hours].filter(Boolean).join(" · ") || "—"));

  box.append(el("h4", {}, "Факти"));
  box.append(list(bk.facts, (f) => [
    `${f.text} (${f.source === "client" ? "від вас" : "сайт"})`,
    f.sourceUrl ? [" — ", el("a", { href: f.sourceUrl, target: "_blank", rel: "noopener noreferrer" }, "джерело")] : null,
    f.quote ? [" «", f.quote, "»"] : null,
  ]));

  if (bk.questions && bk.questions.length > 0) {
    box.append(el("h4", {}, "Питання"));
    box.append(list(bk.questions, (q) => [q.text, " (за замовчуванням: ", q.default, ")",
      q.options?.length ? ` Варіанти: ${q.options.join(" / ")}` : ""]));
  }

  box.append(el("h4", {}, "Формати"));
  const checks = Object.entries(FORMAT_LABELS).map(([f, label]) =>
    el("label", {}, el("input", { type: "checkbox", value: f, checked: p.formats.includes(f) }), ` ${label} `));
  box.append(el("p", {}, checks, el("button", { type: "button", onclick: () => {
    const chosen = checks.map((l) => l.querySelector("input")).filter((i) => i.checked).map((i) => FORMAT_LABELS[i.value]);
    if (chosen.length === 0) return showError("chatError", "Оберіть хоча б один формат.");
    sendMessage(`Формати: ${chosen.join(", ")}`);
  } }, "Обрати формати")));

  if (p.languageOptions && p.languageOptions.length > 1) {
    box.append(el("h4", {}, "Мова відео"));
    box.append(el("p", {}, p.languageOptions.map((o) =>
      el("button", { type: "button", onclick: () => sendMessage(`Мова відео: ${o.lang}`) }, o.lang), " ")));
  }

  if (p.photos && p.photos.length > 0) {
    box.append(el("h4", {}, "Фото"));
    box.append(el("p", {}, p.photos.map((ph) => el("img", { src: ph.url, width: 160, alt: ph.assetId }), " ")));
  }
  if (p.needMorePhotos) box.append(el("p", {}, el("b", {}, "Придатних фото замало — додайте ще, будь ласка (форма нижче).")));
  if (bk.fixes && bk.fixes.length > 0) {
    box.append(el("p", {}, `Автоматичні виправлення: ${bk.fixes.join("; ")}`));
  }
}

function renderScriptCheckpoint(p, box) {
  const sb = p.storyboard;
  const unverified = (p.claims?.unverified) || [];
  box.append(el("p", {}, el("b", {}, "Концепт: "), sb.concept));
  box.append(el("p", {}, el("b", {}, "Хук: "), sb.hook));
  box.append(el("p", {}, `Тривалість: ${Math.round(p.durationSeconds)} с`));
  const rows = sb.scenes.map((s) => {
    const marks = unverified.filter((c) => c.sceneId === s.id).map((c) => `«${c.text}»`);
    return el("tr", {},
      el("td", {}, s.id), el("td", {}, s.purpose), el("td", {}, `${(s.durationFrames / sb.fps).toFixed(1)} с`),
      el("td", {}, s.text.headline), el("td", {}, s.text.sub || ""),
      el("td", {}, marks.length ? `не підтверджено: ${marks.join(", ")}` : ""));
  });
  box.append(el("table", { border: 1, cellpadding: 4 },
    el("tr", {}, ["Сцена", "Роль", "Час", "Заголовок", "Підзаголовок", "Перевірка"].map((h) => el("th", {}, h))),
    rows));
  if (unverified.length > 0) {
    box.append(el("p", {}, el("b", {}, "Позначені твердження не знайдено на сайті. «Затвердити» означає, що ви їх підтверджуєте.")));
  }
  if (p.thumbnails && p.thumbnails.length > 0) {
    box.append(el("p", {}, p.thumbnails.map((t) => el("img", { src: t.url, width: 120, alt: t.assetId }), " ")));
  }
  const mb = p.musicBrief;
  box.append(el("p", {}, el("b", {}, "Музика: "),
    `${mb.genre}; настрій: ${mb.mood.join(", ")}; ${mb.bpm} BPM; інструменти: ${mb.instrumentation.join(", ")}`));
}

function renderStoryboardCheckpoint(p, box) {
  box.append(el("p", {}, `Основний формат: ${FORMAT_LABELS[p.primaryFormat] || p.primaryFormat}`));
  if (p.changedScenes) box.append(el("p", {}, `Змінені сцени: ${p.changedScenes.join(", ")}`));
  const byScene = {};
  for (const s of p.stills) {
    if (!byScene[s.sceneId]) byScene[s.sceneId] = [];
    byScene[s.sceneId].push(s);
  }
  for (const [sceneId, stills] of Object.entries(byScene)) {
    box.append(el("p", {}, el("b", {}, `${sceneId}: `),
      stills.map((s) => el("a", { href: s.url, target: "_blank" }, el("img", { src: s.url, width: 200, alt: `${sceneId}-${s.variant}` })), " ")));
  }
  for (const sh of p.sheets) {
    box.append(el("p", {}, `Аркуш ${FORMAT_LABELS[sh.format] || sh.format}: `,
      el("a", { href: sh.url, target: "_blank" }, el("img", { src: sh.url, width: 360, alt: sh.format }))));
  }
  if (p.templateScenes && p.templateScenes.length > 0) {
    box.append(el("p", {}, `Сцени на шаблоні: ${p.templateScenes.join(", ")}`));
  }
  if (p.warnings && p.warnings.length > 0) {
    box.append(el("p", {}, el("b", {}, "Зауваження перевірки (рішення за вами):")));
    box.append(list(p.warnings, (w) => `${w.sceneId} ${FORMAT_LABELS[w.format] || w.format} [${w.severity}]: ${w.description}`));
  }
  if (p.music) {
    setMusic(p.music.url);
    box.append(el("p", {}, "Музика: ", el("audio", { controls: true, preload: "none", src: p.music.url })));
  }
}

const CHECKPOINT_TITLES = { brand: "Чекпоінт 1 — бренд", script: "Чекпоінт 2 — тексти", storyboard: "Чекпоінт 3 — розкадровка" };

function renderCheckpoint(ev) {
  currentRev = ev.rev;
  const box = el("div", { "data-checkpoint": ev.checkpoint }, el("h3", {}, `${CHECKPOINT_TITLES[ev.checkpoint]} (ревізія ${ev.rev})`));
  try {
    if (ev.payload.checkpoint === "brand") renderBrandCheckpoint(ev.payload, box);
    else if (ev.payload.checkpoint === "script") renderScriptCheckpoint(ev.payload, box);
    else if (ev.payload.checkpoint === "storyboard") renderStoryboardCheckpoint(ev.payload, box);
  } catch (e) {
    box.append(el("p", {}, `Не вдалося показати чекпоінт: ${e.message}`));
  }
  box.append(buttonsFor(["approve", "edit"]));
  feed(box);
}

function onEvent(e) {
  if (e.lastEventId) {
    if (seen.has(e.lastEventId)) return;
    seen.add(e.lastEventId);
    lastEventId = e.lastEventId;
  }
  let ev;
  try {
    ev = JSON.parse(e.data);
  } catch (err) {
    return;
  }
  switch (ev.type) {
    case "message": return renderMessage(ev);
    case "progress": return renderProgress(ev);
    case "checkpoint": return renderCheckpoint(ev);
    case "artifact": return renderArtifact(ev);
    case "cost": return renderCost(ev);
    case "state": return renderState(ev);
    case "error": return renderError(ev);
  }
}

/* ---------- SSE з відновленням ---------- */

function connect() {
  clearTimeout(reconnectTimer);
  if (source) source.close();
  // Браузер сам шле Last-Event-ID при автоперепідключенні; коли перестворюємо EventSource
  // вручну — передаємо його параметром.
  const url = projectPath("/events") + (lastEventId ? `?lastEventId=${encodeURIComponent(lastEventId)}` : "");
  source = new EventSource(url);
  for (const type of EVENT_TYPES) source.addEventListener(type, onEvent);
  source.onopen = () => { $("conn").textContent = "на зв'язку"; };
  source.onerror = (e) => {
    // Подія чату `error` теж приходить сюди (той самий тип) — її вже обробив onEvent.
    if (typeof e.data === "string") return;
    if (source.readyState === EventSource.OPEN) return;
    if (source.readyState === EventSource.CLOSED) {
      $("conn").textContent = "з'єднання втрачено, перепідключаюсь…";
      reconnectTimer = setTimeout(connect, 3000);
    } else {
      $("conn").textContent = "перепідключаюсь…";
    }
  };
}

async function openChat() {
  $("start").hidden = true;
  $("chat").hidden = false;
  $("projectId").textContent = projectId;
  try {
    const info = await api(projectPath(""));
    applyStatus(info.status);
    $("cost").textContent = `Витрачено: ${money(info.totalUsd)}`;
    if (info.project) currentRev = info.project.rev;
  } catch (e) {
    showError("chatError", e.message);
  }
  connect();
}

/* ---------- Форми ---------- */

$("startForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  showError("startError", "");
  $("startBtn").disabled = true;
  try {
    const data = await api("/api/projects", { method: "POST", body: new FormData(e.target) });
    projectId = data.id;
    history.replaceState(null, "", `/?project=${encodeURIComponent(projectId)}`);
    await openChat();
  } catch (err) {
    showError("startError", err.message);
  } finally {
    $("startBtn").disabled = false;
  }
});

$("msgForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (await sendMessage($("msgText").value)) $("msgText").value = "";
});

$("msgText").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("msgForm").requestSubmit();
});

$("btnApprove").addEventListener("click", approve);
$("btnEdit").addEventListener("click", startEdit);
$("btnRetry").addEventListener("click", retry);

$("uploadForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const files = $("uploadFiles").files;
  if (!files || files.length === 0) return showError("chatError", "Оберіть фото.");
  const form = new FormData();
  for (const f of files) form.append("photos", f);
  showError("chatError", "");
  try {
    await api(projectPath("/uploads"), { method: "POST", body: form });
    $("uploadFiles").value = "";
  } catch (err) {
    showError("chatError", err.message);
  }
});

if (projectId) openChat();
</script>
</body>
</html>
